# InfraShield
# Mumbai 10 x 10 km study area.
#
# Centered on Powai / IIT Bombay area (~19.13 N, 72.91 E). Bounding box in
# WGS84: south, west, north, east. Roughly 10.5 km north-south x 11 km
# east-west at this latitude -- close enough to the requested 10 x 10 km and
# keeps the box aligned to round decimal degrees.
#
# The Overpass QL snippets below are rendered into queries as
#   [bbox];  (i.e. "{{bbox}}" is substituted with "s,w,n,e")

[study_area]
center_lat = 19.13
center_lon = 72.91
half_size_km = 5.0

[bounding_box]
south = 19.0850
west = 72.8550
north = 19.1750
east = 72.9650
